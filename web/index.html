<!DOCTYPE html>
<html lang="am">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- SEO -->
    <title>Wise Shop Tracker — Smart Inventory, Sales & Expenses</title>
    <meta name="description" content="Wise Shop Tracker: The smart inventory, sales, and expense tracking system for Ethiopian businesses. Track stock, sales, purchases, and reports in real time." />

    <!-- PWA & Mobile Web App Meta -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563EB" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Wise Shop Tracker" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        height: 100%;
        background-color: #F8FAFC;
      }

      /*
       * KEY: #root starts invisible. No React content — not even a single
       * white frame from Expo Router's initialization — can ever be seen by
       * the user until we explicitly call __hideSplash() and add .ready.
       * This is the definitive fix for the white-page flash.
       */
      #root {
        height: 100%;
        background-color: #F8FAFC;
        opacity: 0;
        transition: opacity 0.2s ease;
      }

      #root.ready {
        opacity: 1;
      }

      /* Instant branded splash — renders before any JS loads */
      #splash {
        position: fixed;
        inset: 0;
        background: #F8FAFC;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        z-index: 9999;
        transition: opacity 0.2s ease;
      }

      #splash.hidden {
        opacity: 0;
        pointer-events: none;
      }

      #splash-logo {
        font-size: 40px;
        font-weight: 800;
        color: #0F172A;
        letter-spacing: -1px;
        font-family: system-ui, -apple-system, sans-serif;
      }

      #splash-logo span {
        color: #2563EB;
      }

      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(37, 99, 235, 0.15);
        border-top-color: #2563EB;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- Branded splash: visible immediately, before any JS -->
    <div id="splash">
      <div id="splash-logo">Wise <span>Shop Tracker</span></div>
      <div class="spinner"></div>
    </div>

    <!-- App root: invisible until __hideSplash() adds .ready -->
    <div id="root"></div>

    <script>
      // Called by React (in _layout.tsx) once auth + subscription are resolved.
      // Atomically: fades out the splash AND fades in #root together.
      // This guarantees the user NEVER sees any intermediate React state
      // (Expo Router init, white frames, spinner flashes, etc.)
      window.__hideSplash = function() {
        var splash = document.getElementById('splash');
        var root   = document.getElementById('root');
        if (root)   root.classList.add('ready');    // fade #root in
        if (splash) splash.classList.add('hidden'); // fade splash out
        setTimeout(function() {
          if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
        }, 250);
      };
      // Failsafe: if React never calls __hideSplash (network error, crash, etc.)
      // force-show the app after 15s so the user isn't stuck forever.
      setTimeout(window.__hideSplash, 15000);

      // Register PWA service worker on supported browsers
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function(e) {
            console.debug('SW reg skipped:', e);
          });
        });
      }
    </script>
  </body>
</html>
